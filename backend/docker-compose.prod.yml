services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    image: unbeatablebann/ai-crm-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Database URL is now expected to be provided in the .env file pointing to a managed service
      - REDIS_URL_DEV=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
